<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8FD0FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E🐾%3C/text%3E%3C/svg%3E" />
    <title>StackPop · 萌宠叠叠消</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dff1ff;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      body { display: flex; align-items: stretch; justify-content: center; }
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        background: linear-gradient(180deg, #8fd0ff 0%, #e8f5ff 100%);
      }
      canvas { display: block; touch-action: none; }
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 28px;
        text-align: center;
        color: #624d7b;
        background: rgba(235, 245, 255, 0.94);
        font-size: 20px;
        font-weight: 700;
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
      @media (min-width: 900px) and (min-height: 700px) and (pointer: fine) {
        body {
          align-items: center;
          background:
            radial-gradient(circle at 50% 25%, rgba(255,255,255,.75), transparent 42%),
            linear-gradient(160deg, #cfe9ff 0%, #eaf4ff 55%, #f7fbff 100%);
        }
        #game {
          flex: none;
          width: min(480px, 100vw);
          height: clamp(700px, calc(100dvh - 64px), 920px);
          padding: 0;
          border: 1px solid rgba(77, 126, 170, .18);
          border-radius: 24px;
          box-shadow: 0 18px 48px rgba(60, 110, 170, .22);
          overflow: hidden;
        }
        #game canvas { border-radius: inherit; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint" role="status">↻&nbsp;&nbsp;请旋转手机，竖屏体验更好</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
