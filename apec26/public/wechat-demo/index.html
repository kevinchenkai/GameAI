<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>深圳 · Hello Shenzhen</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #f4f5ef; color: #183d35; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 540px; margin: auto; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; letter-spacing: .12em; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    #language { min-height: 44px; padding: 8px 15px; border: 1px solid #bbccc2; border-radius: 24px; color: #183d35; background: transparent; letter-spacing: 0; }
    .art { height: 178px; margin: 28px 0; border-radius: 90px 90px 20px 20px; background: #d7e6dc; display: grid; place-items: center; overflow: hidden; }
    .sun { width: 108px; height: 108px; border-radius: 50%; background: #e9b75e; box-shadow: 0 62px 0 18px #538c77, 0 90px 0 38px #2c6252; }
    h1 { margin: 28px 0 12px; font-size: clamp(36px, 10vw, 52px); line-height: 1.15; letter-spacing: -.04em; }
    .intro { margin: 0; color: #5c6e65; font-size: 16px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 28px 0; }
    .card { padding: 18px 14px; border: 1px solid #dce3d9; border-radius: 16px; background: #fffef9; font-size: 15px; }
    .card span { display: block; margin-bottom: 8px; color: #58846c; font-size: 11px; letter-spacing: .1em; }
    #hello { width: 100%; min-height: 54px; padding: 14px; border: 0; border-radius: 14px; color: white; background: #204e3f; font-size: 16px; font-weight: 600; }
    button:focus-visible { outline: 3px solid #b17825; outline-offset: 4px; }
    #result { min-height: 28px; text-align: center; margin: 14px 0 26px; font-size: 14px; }
    footer { padding-top: 18px; border-top: 1px solid #d9e0d5; font-size: 12px; color: #66776b; line-height: 1.8; }
    footer p { margin: 2px 0; }
  </style>
</head>
<body>
  <main>
    <header><strong>SHENZHEN · 2026</strong><button id="language" type="button">English</button></header>
    <div class="art" aria-hidden="true"><div class="sun"></div></div>
    <h1 id="title">你好，深圳。</h1>
    <p id="intro" class="intro">一座城市，四种相遇。<br>从这里，开始你的深圳之旅。</p>
    <div class="grid">
      <div class="card"><span>01 · EXPLORE</span><b data-zh="深圳旅游" data-en="Explore Shenzhen">深圳旅游</b></div>
      <div class="card"><span>02 · TASTE</span><b data-zh="深圳美食" data-en="Eat & drink">深圳美食</b></div>
      <div class="card"><span>03 · DISCOVER</span><b data-zh="深圳手信" data-en="Local gifts">深圳手信</b></div>
      <div class="card"><span>04 · CONNECT</span><b data-zh="私人地陪" data-en="Local guides">私人地陪</b></div>
    </div>
    <button id="hello" type="button">向深圳问个好</button>
    <p id="result" role="status" aria-live="polite">点击按钮，试试互动。</p>
    <footer><p id="environment">运行环境：浏览器</p><p id="note">流程测试页 · v0.1.0 · 暂不提供预订或购买</p></footer>
  </main>
  <script>
    (() => {
      let lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
      let count = 0;
      const copy = {
        zh: { title: '你好，深圳。', intro: '一座城市，四种相遇。<br>从这里，开始你的深圳之旅。', hello: '向深圳问个好', idle: '点击按钮，试试互动。', result: n => `深圳收到你的第 ${n} 次问好！`, browser: '浏览器', wechat: '微信浏览器', mini: '微信小程序', environment: '运行环境：', note: '流程测试页 · v0.1.0 · 暂不提供预订或购买' },
        en: { title: 'Hello, Shenzhen.', intro: 'One city. Four ways to connect.<br>Your Shenzhen story starts here.', hello: 'Say hello to Shenzhen', idle: 'Tap the button to try it.', result: n => `Hello received! You have waved ${n} time${n === 1 ? '' : 's'}.`, browser: 'Browser', wechat: 'WeChat browser', mini: 'WeChat Mini Program', environment: 'Environment: ', note: 'Flow test · v0.1.0 · No bookings or purchases' }
      };
      function render() {
        const t = copy[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.getElementById('title').textContent = t.title;
        document.getElementById('intro').innerHTML = t.intro;
        document.getElementById('language').textContent = lang === 'zh' ? 'English' : '简体中文';
        document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = el.dataset[lang]; });
        document.getElementById('hello').textContent = t.hello;
        document.getElementById('result').textContent = count ? t.result(count) : t.idle;
        const mini = window.__wxjs_environment === 'miniprogram' || /miniProgram/i.test(navigator.userAgent);
        const environment = mini ? t.mini : /MicroMessenger/i.test(navigator.userAgent) ? t.wechat : t.browser;
        document.getElementById('environment').textContent = t.environment + environment;
        document.getElementById('note').textContent = t.note;
      }
      document.getElementById('language').addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        const url = new URL(location.href); url.searchParams.set('lang', lang);
        history.replaceState(null, '', url); render();
      });
      document.getElementById('hello').addEventListener('click', () => { count++; render(); });
      document.addEventListener('WeixinJSBridgeReady', render);
      render();
    })();
  </script>
</body>
</html>
